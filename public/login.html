<!DOCTYPE html>
<html lang="nl">
<head>
<!--BASE_HREF-->
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inloggen — Brood</title>
<link rel="icon" href="img/brood-favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<main class="login-wrap">
  <header class="banner">
    <img src="img/login-banner.png" alt="Brood">
  </header>
  <h1 class="login-title">Brood bakken met Clau</h1>

  <form class="login-form" method="POST" action="/login">
    <label>
      Gebruikersnaam
      <input type="text" name="username" autocomplete="username" autocapitalize="off" required autofocus>
    </label>
    <label>
      Wachtwoord
      <input type="password" name="password" autocomplete="current-password" required>
    </label>
    <p class="login-error" hidden>Onjuiste gebruikersnaam of wachtwoord.</p>
    <button type="submit">Inloggen</button>
  </form>
</main>

<script>
  if (location.search.includes('error=1')) {
    document.querySelector('.login-error').hidden = false;
  }
</script>
</body>
</html>
